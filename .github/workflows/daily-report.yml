name: Daily Ads Report

# Zuverlässiger Trigger für die täglichen Endpoints (Vercel-Hobby-Crons sind
# unzuverlässig). Braucht das Repo-Secret CRON_SECRET (= CRON_SECRET aus Vercel).
on:
  # Zeitgesteuerter Lauf läuft jetzt über VERCEL-CRON (vercel.json: 05:00/06:00 UTC
  # = 07:00/08:00 Berlin). Diese Action bleibt nur als MANUELLER Fallback-Knopf,
  # damit die Auswertung nicht doppelt feuert.
  workflow_dispatch: {}    # manueller Knopf in GitHub → Actions

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Daten aktualisieren (daily-briefing)
        if: github.event.schedule == '30 1 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl -fsS -m 90 "https://www.nutra-sana.de/api/cron/daily-briefing" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" | head -c 600 || exit 1

      - name: Auswertung senden (daily-message)
        if: github.event.schedule == '45 1 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl -fsS -m 90 "https://www.nutra-sana.de/api/cron/daily-message" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" | head -c 600 || exit 1
